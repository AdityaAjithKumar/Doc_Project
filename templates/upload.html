<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizApp - Upload</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            padding: 48px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .brand {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #888;
            font-size: 15px;
            margin-bottom: 36px;
        }

        .drop-zone {
            border: 2px dashed #c5cae9;
            border-radius: 16px;
            padding: 40px 20px;
            cursor: pointer;
            transition: all 0.3s;
            background: #fafafe;
            margin-bottom: 24px;
        }

        .drop-zone:hover,
        .drop-zone.dragover {
            border-color: #667eea;
            background: #f0f0ff;
        }

        .drop-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .drop-text {
            font-size: 16px;
            color: #555;
            font-weight: 500;
        }

        .drop-hint {
            font-size: 13px;
            color: #aaa;
            margin-top: 8px;
        }

        .file-input {
            display: none;
        }

        .file-name {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            background: #e8f5e9;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #2e7d32;
            font-weight: 500;
        }

        .file-name.visible { display: flex; }

        .submit-btn {
            display: block;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            opacity: 0.5;
            pointer-events: none;
        }

        .submit-btn.ready {
            opacity: 1;
            pointer-events: auto;
        }

        .submit-btn.ready:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .format-note {
            margin-top: 20px;
            font-size: 12px;
            color: #bbb;
        }

        @media (max-width: 500px) {
            .card { padding: 32px 20px; }
            .brand { font-size: 26px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">QuizApp</div>
        <p class="subtitle">Upload your answer key document to start a quiz</p>

        <form method="POST" enctype="multipart/form-data" id="upload-form">
            <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
                <div class="drop-icon">&#128196;</div>
                <div class="drop-text">Drop your .docx file here</div>
                <div class="drop-hint">or click to browse</div>
            </div>

            <input type="file" name="file" accept=".docx" class="file-input" id="file-input">

            <div class="file-name" id="file-name">
                <span id="file-name-text"></span>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">Start Quiz</button>
        </form>

        <p class="format-note">Supported format: .docx answer key files</p>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileName = document.getElementById('file-name');
        const fileNameText = document.getElementById('file-name-text');
        const submitBtn = document.getElementById('submit-btn');

        fileInput.addEventListener('change', function() {
            if (this.files.length) {
                showFile(this.files[0]);
            }
        });

        dropZone.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', function() {
            this.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', function(e) {
            e.preventDefault();
            this.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length && files[0].name.endsWith('.docx')) {
                fileInput.files = files;
                showFile(files[0]);
            }
        });

        function showFile(file) {
            fileNameText.textContent = file.name;
            fileName.classList.add('visible');
            submitBtn.classList.add('ready');
            dropZone.querySelector('.drop-text').textContent = 'File selected';
            dropZone.querySelector('.drop-hint').textContent = 'Click to change';
        }
    </script>
</body>
</html>
